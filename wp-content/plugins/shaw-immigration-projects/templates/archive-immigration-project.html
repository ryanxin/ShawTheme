<!--
这是一个示例HTML模板，展示如何在Elementor中实现AJAX筛选

您可以在Elementor中创建一个Archive页面或使用Theme Builder为immigration_project创建归档模板
然后将以下HTML结构添加到Elementor的HTML小部件中
-->

<div class="shaw-immigration-filter">
    
    <!-- Loading Indicator -->
    <div class="shaw-loading" style="display: none;"></div>
    
    <!-- First Level Tabs: Countries -->
    <div class="shaw-country-tabs">
        <button class="shaw-country-tab active" data-country="all">All</button>
        <button class="shaw-country-tab" data-country="canada">Canada</button>
        <button class="shaw-country-tab" data-country="turkey">Turkey</button>
        <button class="shaw-country-tab" data-country="greece">Greece</button>
        <button class="shaw-country-tab" data-country="antigua-and-barbuda">Antigua and Barbuda</button>
        <button class="shaw-country-tab" data-country="singapore">Singapore</button>
        <button class="shaw-country-tab" data-country="japan">Japan</button>
        <button class="shaw-country-tab" data-country="united-states">United States</button>
        <button class="shaw-country-tab" data-country="philippines">Philippines</button>
        <button class="shaw-country-tab" data-country="portugal">Portugal</button>
    </div>
    
    <!-- Second Level Tabs: Categories -->
    <div class="shaw-category-tabs">
        <button class="shaw-category-tab active" data-category="all">All</button>
        <button class="shaw-category-tab" data-category="entrepreneur-immigration">Entrepreneur Immigration</button>
        <button class="shaw-category-tab" data-category="skilled-worker-immigration">Skilled Worker Immigration</button>
        <button class="shaw-category-tab" data-category="investment-immigration">Investment Immigration</button>
        <button class="shaw-category-tab" data-category="real-estate-immigration">Real Estate Immigration</button>
    </div>
    
    <!-- Projects Grid Container -->
    <div class="shaw-projects-grid">
        <!-- Projects will be loaded here via AJAX -->
        <!-- Initial loading message -->
        <div style="text-align: center; padding: 60px 20px;">
            <p style="font-size: 18px; color: #707070;">Loading projects...</p>
        </div>
    </div>
    
</div>

<!-- 
Elementor Loop Grid 配置说明:

1. 在Elementor中，您还可以使用 Loop Grid 小部件来显示项目
2. 添加一个 Loop Grid 小部件
3. 在Query设置中:
   - Source: Posts
   - Post Type: Immigration Project
   
4. 在Layout设置中:
   - Columns: 3
   - Gap: 40px
   
5. 为每个Loop Item配置以下字段:
   - 标题: Dynamic Tags > Post Title
   - 图片: Dynamic Tags > ACF Field > card_image
   - 描述: Dynamic Tags > ACF Field > short_description
   - 处理周期: Dynamic Tags > ACF Field > processing_period
   - 身份类型: Dynamic Tags > ACF Field > identity_type
   - 按钮链接: Dynamic Tags > Post URL
   
6. 如果要添加筛选功能，请在页面顶部添加上面的HTML结构
   JavaScript会自动处理筛选逻辑并刷新Loop Grid
-->
